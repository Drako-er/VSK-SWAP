<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crew Flight Swap</title>
  
  <!-- PWA & Mobile Web App settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e293b">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
          <i data-lucide="plane-takeoff" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">Crew Swap</h1>
          <p class="text-xs text-indigo-400 font-medium">Cabin Crew Flight Exchange</p>
        </div>
      </div>
      <button onclick="openFormModal()" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-sm font-semibold shadow-md transition-all active:scale-95">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>스왑 등록</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Notice Banner -->
    <div class="bg-slate-800 border border-indigo-500/30 rounded-2xl p-3.5 flex items-center gap-3 text-xs text-slate-300 shadow-sm">
      <div class="bg-indigo-500/10 p-2 rounded-lg text-indigo-400 shrink-0">
        <i data-lucide="info" class="w-4 h-4"></i>
      </div>
      <div>
        원하는 비행 일정을 등록하고 동료 승무원과 손쉽게 스왑(Swap)해보세요!
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="flex gap-2 text-xs overflow-x-auto pb-1 scrollbar-none">
      <button onclick="filterPosts('ALL')" id="filter-ALL" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white font-medium shadow-sm transition-all">전체</button>
      <button onclick="filterPosts('OFF')" id="filter-OFF" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 font-medium border border-slate-700 transition-all">OFF 요청</button>
      <button onclick="filterPosts('SWAP')" id="filter-SWAP" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 font-medium border border-slate-700 transition-all">노선 교환</button>
    </div>

    <!-- Post List Container -->
    <div id="post-list" class="space-y-3.5">
      <!-- Dynamic Posts -->
    </div>
  </main>

  <!-- Post Registration/Edit Modal -->
  <div id="form-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-200">
      
      <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
        <h2 id="modal-title" class="font-bold text-lg text-white">비행 스왑 등록</h2>
        <button onclick="closeFormModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <div class="p-5 space-y-4 overflow-y-auto text-sm">
        <input type="hidden" id="edit-id" />

        <!-- Position & Aircraft -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">직급 (Position)</label>
            <select id="input-position" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
              <option value="CSS">CSS</option>
              <option value="CS">CS</option>
              <option value="FA">FA</option>
              <option value="PU">PU</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">기종 (Aircraft)</label>
            <select id="input-aircraft" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
              <option value="B787-9">B787-9</option>
              <option value="A350-1000">A350-1000</option>
              <option value="A330-900">A330-900</option>
              <option value="B777-300ER">B777-300ER</option>
            </select>
          </div>
        </div>

        <!-- Flight Info -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">비행 날짜</label>
            <input type="date" id="input-date" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">노선 (예: LHR-JFK)</label>
            <input type="text" id="input-route" placeholder="LHR-JFK" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500 uppercase">
          </div>
        </div>

        <!-- Swap Preference -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">희망 조건 (Swap For)</label>
          <input type="text" id="input-want" placeholder="예: OFF 요청 또는 NRT 노선" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Memo -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">메모 / 요청사항</label>
          <textarea id="input-memo" rows="3" placeholder="추가 설명이나 전달사항을 적어주세요." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>

      </div>

      <div class="p-4 border-t border-slate-700 bg-slate-800 flex gap-2">
        <button onclick="closeFormModal()" class="w-1/3 py-3 rounded-xl border border-slate-600 text-slate-300 font-semibold hover:bg-slate-700">취소</button>
        <button onclick="savePost()" class="w-2/3 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-500 shadow-lg shadow-indigo-600/30">저장하기</button>
      </div>

    </div>
  </div>

  <script>
    // Initial Sample Data
    let posts = [
      {
        id: 1,
        position: 'CSS',
        aircraft: 'B787-9',
        date: '2026-10-15',
        route: 'LHR-JFK',
        want: 'OFF 요청 또는 NRT 노선',
        memo: '주말 포함 비행입니다. OFF 간절히 구해요!',
        createdAt: '10분 전'
      },
      {
        id: 2,
        position: 'CS',
        aircraft: 'A350-1000',
        date: '2026-10-18',
        route: 'LHR-LAX',
        want: 'HKG 또는 SIN 노선',
        memo: '아시아 노선 선호합니다.',
        createdAt: '1시간 전'
      }
    ];

    let currentFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderPosts();
    });

    function renderPosts() {
      const container = document.getElementById('post-list');
      container.innerHTML = '';

      const filtered = posts.filter(post => {
        if (currentFilter === 'OFF') return post.want.includes('OFF');
        if (currentFilter === 'SWAP') return !post.want.includes('OFF');
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-sm">
            등록된 스왑 게시물이 없습니다.
          </div>
        `;
        return;
      }

      filtered.forEach(post => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-sm hover:border-slate-600 transition-all space-y-3';
        
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-2">
              <span class="bg-indigo-500/10 text-indigo-400 font-bold px-2.5 py-1 rounded-lg text-xs border border-indigo-500/20">
                ${post.position}
              </span>
              <span class="bg-slate-700/60 text-slate-300 font-semibold px-2.5 py-1 rounded-lg text-xs">
                ${post.aircraft}
              </span>
            </div>
            <span class="text-[11px] text-slate-500">${post.createdAt}</span>
          </div>

          <div class="space-y-1">
            <div class="flex items-center gap-2 text-white font-bold text-base">
              <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i>
              <span>${post.date}</span>
              <span class="text-slate-500">|</span>
              <span class="text-indigo-300">${post.route}</span>
            </div>
            <p class="text-xs text-slate-300 flex items-center gap-1.5 pt-0.5">
              <span class="text-slate-400 font-medium shrink-0">희망:</span>
              <span class="text-amber-300 font-semibold">${post.want}</span>
            </p>
            ${post.memo ? `<p class="text-xs text-slate-400 italic pt-1">"${post.memo}"</p>` : ''}
          </div>

          <!-- Action Buttons -->
          <div class="pt-2 border-t border-slate-700/60 flex items-center gap-2">
            <button onclick="requestSwap(${post.id})" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md transition-all active:scale-95">
              <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
              <span>스왑 신청하기</span>
            </button>
            <button onclick="deletePost(${post.id})" class="p-2.5 text-slate-500 hover:text-red-400 hover:bg-slate-700/50 rounded-xl transition-all">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Filter Posts
    function filterPosts(type) {
      currentFilter = type;
      ['ALL', 'OFF', 'SWAP'].forEach(t => {
        const btn = document.getElementById(`filter-${t}`);
        if (t === type) {
          btn.className = 'px-3.5 py-2 rounded-xl bg-indigo-600 text-white font-medium shadow-sm transition-all';
        } else {
          btn.className = 'px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 font-medium border border-slate-700 transition-all';
        }
      });
      renderPosts();
    }

    // Modal Control
    function openFormModal(editId = null) {
      if (editId) {
        const post = posts.find(p => p.id === editId);
        document.getElementById('edit-id').value = post.id;
        document.getElementById('input-position').value = post.position;
        document.getElementById('input-aircraft').value = post.aircraft;
        document.getElementById('input-date').value = post.date;
        document.getElementById('input-route').value = post.route;
        document.getElementById('input-want').value = post.want;
        document.getElementById('input-memo').value = post.memo || '';
      } else {
        document.getElementById('edit-id').value = '';
        document.getElementById('input-position').value = 'CSS';
        document.getElementById('input-aircraft').value = 'B787-9';
        document.getElementById('input-date').value = '';
        document.getElementById('input-route').value = '';
        document.getElementById('input-want').value = '';
        document.getElementById('input-memo').value = '';
      }

      document.getElementById('form-modal').classList.remove('hidden');
    }

    function closeFormModal() {
      document.getElementById('form-modal').classList.add('hidden');
    }

    // Save Post
    function savePost() {
      const id = document.getElementById('edit-id').value;
      const position = document.getElementById('input-position').value;
      const aircraft = document.getElementById('input-aircraft').value;
      const date = document.getElementById('input-date').value;
      const route = document.getElementById('input-route').value.toUpperCase();
      const want = document.getElementById('input-want').value;
      const memo = document.getElementById('input-memo').value;

      if (!date || !route || !want) {
        alert('날짜, 노선, 희망 조건을 모두 입력해 주세요.');
        return;
      }

      if (id) {
        const post = posts.find(p => p.id === parseInt(id));
        post.position = position;
        post.aircraft = aircraft;
        post.date = date;
        post.route = route;
        post.want = want;
        post.memo = memo;
      } else {
        posts.unshift({
          id: Date.now(),
          position,
          aircraft,
          date,
          route,
          want,
          memo,
          createdAt: '방금 전'
        });
      }

      closeFormModal();
      renderPosts();
    }

    function deletePost(id) {
      if (confirm('이 게시글을 삭제하시겠습니까?')) {
        posts = posts.filter(p => p.id !== id);
        renderPosts();
      }
    }

    function requestSwap(postId) {
      const post = posts.find(p => p.id === postId);
      alert(`[${post.route} / ${post.date}] 스왑 신청 안내\n작성자에게 스왑 요청 메시지를 보냅니다.`);
    }
  </script>
</body>
</html>
