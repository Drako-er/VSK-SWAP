<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crew Flight Swap</title>
  
  <!-- PWA & Mobile Web App settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e293b">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Kakao SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.6.0/kakao.min.js"></script>
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
          <i data-lucide="plane-takeoff" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">Crew Swap</h1>
          <p class="text-xs text-indigo-400 font-medium">Boeing 787 Fleet</p>
        </div>
      </div>
      <button onclick="openFormModal()" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-sm font-semibold shadow-md transition-all active:scale-95">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>스왑 등록</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Fleet Notice Banner -->
    <div class="bg-slate-800 border border-indigo-500/30 rounded-2xl p-3.5 flex items-center gap-3 text-xs text-slate-300 shadow-sm">
      <div class="bg-indigo-500/10 p-2 rounded-lg text-indigo-400 shrink-0">
        <i data-lucide="info" class="w-4 h-4"></i>
      </div>
      <div>
        본 시스템은 <span class="text-indigo-300 font-bold">Boeing 787</span> 기종 전용 스왑 게시판입니다. 회사 스왑 시스템 URL이 기본 연동됩니다.
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="flex gap-2 text-xs overflow-x-auto pb-1 scrollbar-none">
      <button onclick="filterPosts('ALL')" id="filter-ALL" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white font-medium shadow-sm transition-all">전체</button>
      <button onclick="filterPosts('OFF')" id="filter-OFF" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 font-medium border border-slate-700 transition-all">OFF 요청</button>
      <button onclick="filterPosts('SWAP')" id="filter-SWAP" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 font-medium border border-slate-700 transition-all">노선 교환</button>
    </div>

    <!-- Post List Container -->
    <div id="post-list" class="space-y-3.5">
      <!-- Dynamic Posts -->
    </div>
  </main>

  <!-- Post Registration/Edit Modal -->
  <div id="form-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-200">
      
      <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
        <h2 id="modal-title" class="font-bold text-lg text-white">비행 스왑 등록</h2>
        <button onclick="closeFormModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <div class="p-5 space-y-4 overflow-y-auto text-sm">
        <input type="hidden" id="edit-id" />

        <!-- Position & Aircraft Fixed -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">직급 (Position)</label>
            <select id="input-position" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
              <option value="CSS">CSS</option>
              <option value="CS">CS</option>
              <option value="FA">FA</option>
              <option value="PU">PU</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">기종 (Aircraft)</label>
            <input type="text" value="Boeing 787" readonly class="w-full bg-slate-900/60 border border-slate-700/60 text-indigo-300 font-semibold rounded-xl px-3 py-2.5 cursor-not-allowed">
          </div>
        </div>

        <!-- Flight Info -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">비행 날짜</label>
            <input type="date" id="input-date" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">노선 (예: LHR-JFK)</label>
            <input type="text" id="input-route" placeholder="LHR-JFK" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500 uppercase">
          </div>
        </div>

        <!-- Swap Preference -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">희망 조건 (Swap For)</label>
          <input type="text" id="input-want" placeholder="예: OFF 요청 또는 NRT 노선" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Company Swap URL (Defaulted) -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">회사 스왑 URL</label>
          <input type="url" id="input-link" value="https://vs-crew.aims.aero/eCrew/Dashboard" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-300 text-xs focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Crew List Builder Section -->
        <div class="border-t border-slate-700/80 pt-3.5 space-y-2">
          <div class="flex justify-between items-center">
            <label class="block text-xs font-bold text-indigo-300">동반 비행 크루 명단 (Crew List)</label>
            <button type="button" onclick="addCrewInput()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> 크루 추가
            </button>
          </div>
          <div id="crew-inputs-container" class="space-y-2 max-h-36 overflow-y-auto pr-1">
            <!-- Dynamic crew row inputs -->
          </div>
          <p class="text-[11px] text-slate-400">* 웹/앱 모달에서 확인 가능합니다. (카카오톡 메시지에는 포함되지 않습니다)</p>
        </div>

        <!-- Memo -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">메모 / 요청사항</label>
          <textarea id="input-memo" rows="2" placeholder="추가 설명이나 전달사항을 적어주세요." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>

      </div>

      <div class="p-4 border-t border-slate-700 bg-slate-800 flex gap-2">
        <button onclick="closeFormModal()" class="w-1/3 py-3 rounded-xl border border-slate-600 text-slate-300 font-semibold hover:bg-slate-700">취소</button>
        <button onclick="savePost()" class="w-2/3 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-500 shadow-lg shadow-indigo-600/30">저장하기</button>
      </div>

    </div>
  </div>

  <!-- Crew List Viewing Modal -->
  <div id="crew-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="users" class="w-5 h-5 text-indigo-400"></i>
          <h3 class="font-bold text-white text-base">동반 비행 크루 명단</h3>
        </div>
        <button onclick="closeCrewModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div id="crew-modal-content" class="space-y-2 max-h-60 overflow-y-auto text-sm text-slate-200">
        <!-- Rendered crew list -->
      </div>

      <button onclick="closeCrewModal()" class="w-full py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-medium">
        닫기
      </button>
    </div>
  </div>

  <script>
    // Initialize Kakao SDK (Optional Key insertion)
    if (window.Kakao && !window.Kakao.isInitialized()) {
      try {
        window.Kakao.init('YOUR_JAVASCRIPT_KEY_HERE');
      } catch (e) {}
    }

    // Default Sample Data
    let posts = [
      {
        id: 1,
        position: 'CSS',
        aircraft: 'Boeing 787',
        date: '2026-10-15',
        route: 'LHR-JFK',
        want: 'OFF 요청 또는 NRT 노선',
        link: 'https://vs-crew.aims.aero/eCrew/Dashboard',
        memo: '주말 포함 비행입니다. OFF 간절히 구해요!',
        createdAt: '10분 전',
        crews: [
          { role: 'Captain', name: 'John Smith' },
          { role: 'F/O', name: 'David Lee' },
          { role: 'CSS', name: 'Kim Cabin' },
          { role: 'FA', name: 'Sarah Parker' }
        ]
      },
      {
        id: 2,
        position: 'CS',
        aircraft: 'Boeing 787',
        date: '2026-10-18',
        route: 'LHR-LAX',
        want: 'HKG 또는 SIN 노선',
        link: 'https://vs-crew.aims.aero/eCrew/Dashboard',
        memo: '아시아 노선 선호합니다.',
        createdAt: '1시간 전',
        crews: [
          { role: 'Captain', name: 'Michael B.' },
          { role: 'CS', name: 'Minsoo Park' },
          { role: 'FA', name: 'Jessica W.' }
        ]
      }
    ];

    let currentFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderPosts();
    });

    function renderPosts() {
      const container = document.getElementById('post-list');
      container.innerHTML = '';

      const filtered = posts.filter(post => {
        if (currentFilter === 'OFF') return post.want.includes('OFF');
        if (currentFilter === 'SWAP') return !post.want.includes('OFF');
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-sm">
            등록된 스왑 게시물이 없습니다.
          </div>
        `;
        return;
      }

      filtered.forEach(post => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-sm hover:border-slate-600 transition-all space-y-3';
        
        const hasCrews = post.crews && post.crews.length > 0;

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-2">
              <span class="bg-indigo-500/10 text-indigo-400 font-bold px-2.5 py-1 rounded-lg text-xs border border-indigo-500/20">
                ${post.position}
              </span>
              <span class="bg-slate-700/60 text-slate-300 font-semibold px-2.5 py-1 rounded-lg text-xs">
                ${post.aircraft}
              </span>
            </div>
            <span class="text-[11px] text-slate-500">${post.createdAt}</span>
          </div>

          <div class="space-y-1">
            <div class="flex items-center gap-2 text-white font-bold text-base">
              <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i>
              <span>${post.date}</span>
              <span class="text-slate-500">|</span>
              <span class="text-indigo-300">${post.route}</span>
            </div>
            <p class="text-xs text-slate-300 flex items-center gap-1.5 pt-0.5">
              <span class="text-slate-400 font-medium shrink-0">희망:</span>
              <span class="text-amber-300 font-semibold">${post.want}</span>
            </p>
            ${post.memo ? `<p class="text-xs text-slate-400 italic pt-1">"${post.memo}"</p>` : ''}
          </div>

          <!-- Crew List View Button (Web/App only) -->
          ${hasCrews ? `
            <div class="pt-1">
              <button onclick="openCrewModal(${post.id})" class="text-xs bg-slate-700/40 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors border border-slate-700">
                <i data-lucide="users" class="w-3.5 h-3.5 text-indigo-400"></i>
                <span>👥 크루 리스트 보기 (${post.crews.length}명)</span>
              </button>
            </div>
          ` : ''}

          <!-- Action Buttons -->
          <div class="pt-2 border-t border-slate-700/60 flex items-center gap-2">
            <button onclick="requestKakaoSwap(${post.id})" class="flex-1 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md transition-all active:scale-95">
              <i data-lucide="message-circle" class="w-4 h-4 fill-slate-950"></i>
              <span>💬 스왑 요청하기 (카톡)</span>
            </button>
            <button onclick="deletePost(${post.id})" class="p-2.5 text-slate-500 hover:text-red-400 hover:bg-slate-700/50 rounded-xl transition-all">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Filter Posts
    function filterPosts(type) {
      currentFilter = type;
      ['ALL', 'OFF', 'SWAP'].forEach(t => {
        const btn = document.getElementById(`filter-${t}`);
        if (t === type) {
          btn.className = 'px-3.5 py-2 rounded-xl bg-indigo-600 text-white font-medium shadow-sm transition-all';
        } else {
          btn.className = 'px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 font-medium border border-slate-700 transition-all';
        }
      });
      renderPosts();
    }

    // Modal Control
    function openFormModal(editId = null) {
      const container = document.getElementById('crew-inputs-container');
      container.innerHTML = '';

      if (editId) {
        const post = posts.find(p => p.id === editId);
        document.getElementById('edit-id').value = post.id;
        document.getElementById('input-position').value = post.position;
        document.getElementById('input-date').value = post.date;
        document.getElementById('input-route').value = post.route;
        document.getElementById('input-want').value = post.want;
        document.getElementById('input-link').value = post.link || 'https://vs-crew.aims.aero/eCrew/Dashboard';
        document.getElementById('input-memo').value = post.memo || '';
        
        if (post.crews) {
          post.crews.forEach(c => addCrewInput(c.role, c.name));
        }
      } else {
        document.getElementById('edit-id').value = '';
        document.getElementById('input-position').value = 'CSS';
        document.getElementById('input-date').value = '';
        document.getElementById('input-route').value = '';
        document.getElementById('input-want').value = '';
        document.getElementById('input-link').value = 'https://vs-crew.aims.aero/eCrew/Dashboard';
        document.getElementById('input-memo').value = '';
        addCrewInput('Captain', '');
        addCrewInput('CS/FA', '');
      }

      document.getElementById('form-modal').classList.remove('hidden');
    }

    function closeFormModal() {
      document.getElementById('form-modal').classList.add('hidden');
    }

    // Dynamic Crew Inputs
    function addCrewInput(role = '', name = '') {
      const container = document.getElementById('crew-inputs-container');
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 crew-input-row';
      row.innerHTML = `
        <input type="text" placeholder="직책 (예: Capt, CS)" value="${role}" class="crew-role w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
        <input type="text" placeholder="이름" value="${name}" class="crew-name w-2/3 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
        <button type="button" onclick="this.parentElement.remove()" class="text-slate-500 hover:text-red-400 p-1">
          <i data-lucide="minus-circle" class="w-4 h-4"></i>
        </button>
      `;
      container.appendChild(row);
      lucide.createIcons();
    }

    // Save Post
    function savePost() {
      const id = document.getElementById('edit-id').value;
      const position = document.getElementById('input-position').value;
      const date = document.getElementById('input-date').value;
      const route = document.getElementById('input-route').value.toUpperCase();
      const want = document.getElementById('input-want').value;
      const link = document.getElementById('input-link').value || 'https://vs-crew.aims.aero/eCrew/Dashboard';
      const memo = document.getElementById('input-memo').value;

      if (!date || !route || !want) {
        alert('날짜, 노선, 희망 조건을 모두 입력해 주세요.');
        return;
      }

      // Collect crew list
      const crews = [];
      document.querySelectorAll('.crew-input-row').forEach(row => {
        const r = row.querySelector('.crew-role').value.trim();
        const n = row.querySelector('.crew-name').value.trim();
        if (r || n) {
          crews.push({ role: r || 'Member', name: n || '-' });
        }
      });

      if (id) {
        const post = posts.find(p => p.id === parseInt(id));
        post.position = position;
        post.date = date;
        post.route = route;
        post.want = want;
        post.link = link;
        post.memo = memo;
        post.crews = crews;
      } else {
        posts.unshift({
          id: Date.now(),
          position,
          aircraft: 'Boeing 787',
          date,
          route,
          want,
          link,
          memo,
          createdAt: '방금 전',
          crews
        });
      }

      closeFormModal();
      renderPosts();
    }

    function deletePost(id) {
      if (confirm('이 게시글을 삭제하시겠습니까?')) {
        posts = posts.filter(p => p.id !== id);
        renderPosts();
      }
    }

    // View Crew Modal
    function openCrewModal(postId) {
      const post = posts.find(p => p.id === postId);
      if (!post || !post.crews) return;

      const container = document.getElementById('crew-modal-content');
      container.innerHTML = '';

      post.crews.forEach(c => {
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50';
        item.innerHTML = `
          <span class="text-indigo-300 font-semibold text-xs bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">${c.role}</span>
          <span class="text-slate-200 font-medium">${c.name}</span>
        `;
        container.appendChild(item);
      });

      document.getElementById('crew-modal').classList.remove('hidden');
    }

    function closeCrewModal() {
      document.getElementById('crew-modal').classList.add('hidden');
    }

    // Kakao Talk Swap Request (Simplified text message format)
    function requestKakaoSwap(postId) {
      const post = posts.find(p => p.id === postId);
      if (!post) return;

      // Clean, concise Kakao text template without crew list
      const messageText = 
`✈️ [Crew Flight Swap]

• 비행: ${post.route} (${post.date})
• 기종/직급: B787 / ${post.position}
• 희망: ${post.want}
${post.memo ? `• 메모: ${post.memo}\n` : ''}
🔗 회사 스왑 링크:
${post.link}`;

      // Copy message to clipboard
      navigator.clipboard.writeText(messageText).then(() => {
        alert("카카오톡 공유 문구가 복사되었습니다!\n열리는 카카오톡 채팅방에 [붙여넣기] 해주세요.");
        
        // Open KakaoTalk App via URL Scheme
        window.location.href = "kakaolink://send";
      }).catch(() => {
        // Fallback for clipboard block
        prompt("아래 메시지를 복사하여 카카오톡에 전송하세요:", messageText);
      });
    }
  </script>
</body>
</html>
